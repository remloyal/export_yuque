name: build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

jobs:
  pyinstaller:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm main.spec

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "dist\\main\\*" -DestinationPath "out\\yuque_document_download-windows.zip" -Force

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "dist/main" "out/yuque_document_download-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuque_document_download-${{ runner.os }}
          path: out/*.zip
          if-no-files-found: error
